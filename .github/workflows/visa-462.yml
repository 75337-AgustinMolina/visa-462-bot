name: Vigilar visa 462

on:
  schedule:
    # Cada 15 minutos, todo el día (GitHub usa hora UTC; los minutos "raros" evitan demoras de la hora en punto)
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Enviar notificación de prueba"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: visa-462
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/visa-462.yml

      - name: Cachear el navegador
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-v1

      - name: Instalar navegador (Chromium)
        run: |
          pip install playwright==1.47.0
          python -m playwright install --with-deps chromium

      - name: Revisar estado del cupo
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          COUNTRY: Argentina
          FORCE_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test && '1' || '0' }}
        run: python check_visa.py

      - name: Guardar estado
        if: always()
        run: |
          git config user.name "visa-bot"
          git config user.email "visa-bot@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Actualizar estado" && git pull --rebase && git push)
